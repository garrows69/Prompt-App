<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://generativelanguage.googleapis.com; style-src 'self' 'unsafe-inline';">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Prompt Optimizer & Compiler</title>
    
    <link rel="manifest" href="manifest.json">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --surface: #ffffff;
            --background: #f3f4f6;
            --text-main: #111827;
            --text-muted: #4b5563;
            --border: #d1d5db;
            --border-focus: #3b82f6;
            --disabled-bg: #9ca3af;
            --disabled-text: #f3f4f6;
            --final-surface: #f8fafc;
            --final-border: #cbd5e1;
            --error: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .app-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            padding-top: env(safe-area-inset-top);
        }
        
        .app-title { margin: 0; font-size: 1.5rem; font-weight: 700; }

        .section {
            background: var(--surface);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border);
            position: relative;
        }

        .byok-section {
            background-color: #e0f2fe;
            border-color: #bae6fd;
        }

        label { display: block; font-size: 1.1rem; margin-bottom: 12px; font-weight: 600; }
        .step-num { color: var(--primary); font-weight: 800; margin-right: 6px; }

        .textarea-wrapper { position: relative; width: 100%; }

        textarea, input[type="password"] {
            width: 100%;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fafafa;
            transition: all 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            background-color: var(--surface);
        }

        .action-row { display: flex; flex-direction: column; margin-top: 16px; gap: 12px; }
        .microcopy { font-size: 0.85rem; color: var(--text-muted); font-style: italic; text-align: center; }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            min-height: 48px;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-secondary { background-color: transparent; color: var(--text-muted); border: 1px solid var(--border); width: auto; }

        .copy-btn {
            position: absolute; top: 8px; right: 8px; width: 40px; height: 40px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .spinner {
            display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; margin-right: 10px;
        }
        .is-loading .spinner { display: inline-block; }
        .is-loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #toast-container {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 50; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px;
        }
        .toast {
            padding: 14px 20px; border-radius: 10px; color: white; font-weight: 500;
            opacity: 0; transform: translateY(20px); transition: 0.3s; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background-color: var(--error); }
        .toast.success { background-color: var(--success); }

        @media (min-width: 640px) {
            .app-header, .action-row { flex-direction: row; align-items: center; justify-content: space-between; }
            #toast-container { bottom: auto; top: 24px; right: 24px; left: auto; transform: none; width: auto; }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <header class="app-header">
        <h1 class="app-title">Prompt Optimizer</h1>
        <button id="startOverBtn" class="btn-secondary">↻ Start Over</button>
    </header>

    <section class="section byok-section">
        <label for="apiKeyInput">Gemini API Key</label>
        <input type="password" id="apiKeyInput" placeholder="Paste your Gemini API key here...">
        <p class="microcopy" style="text-align: left; margin-top: 8px;">
            *Your key is saved locally to your browser and never sent to our servers. Get a free key at <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>.
        </p>
    </section>

    <main>
        <section class="section">
            <label for="userInput"><span class="step-num">1.</span> Original Prompt</label>
            <div class="textarea-wrapper">
                <textarea id="userInput" data-min-height="120" placeholder="Enter your raw prompt..."></textarea>
            </div>
            <div class="action-row">
                <button id="upgradeBtn" class="btn-primary">
                    <span class="spinner"></span><span class="btn-text">Upgrade Prompt ↓</span>
                </button>
            </div>
        </section>

        <section class="section">
            <label for="upgradedArea"><span class="step-num">2.</span> Upgraded Prompt</label>
            <div class="textarea-wrapper">
                <textarea id="upgradedArea" data-min-height="120" placeholder="Optimized result..."></textarea>
                <button class="copy-btn" id="copyUpgradedBtn" title="Copy to clipboard">📋</button>
            </div>
            <div class="action-row">
                <button id="compileBtn" class="btn-primary">
                    <span class="spinner"></span><span class="btn-text">Compile Prompt ↓</span>
                </button>
            </div>
        </section>

        <section class="section">
            <label for="outputArea"><span class="step-num">3.</span> Compiled Instructions</label>
            <div class="textarea-wrapper">
                <textarea id="outputArea" data-min-height="200" placeholder="Final structured agent instructions..."></textarea>
                <button class="copy-btn" id="copyCompiledBtn" title="Copy to clipboard">📋</button>
            </div>
        </section>
    </main>

    <script>
        class PromptApp {
            constructor() {
                this.elements = {
                    apiKeyInput: document.getElementById('apiKeyInput'),
                    inputs: [
                        document.getElementById('userInput'),
                        document.getElementById('upgradedArea'),
                        document.getElementById('outputArea')
                    ],
                    buttons: {
                        upgrade: document.getElementById('upgradeBtn'),
                        compile: document.getElementById('compileBtn'),
                        startOver: document.getElementById('startOverBtn'),
                        copyUpgraded: document.getElementById('copyUpgradedBtn'),
                        copyCompiled: document.getElementById('copyCompiledBtn')
                    },
                    toastContainer: document.getElementById('toast-container')
                };
                this.abortController = null;
                this.init();
            }

            init() {
                this.setupStorageAndAutoGrow();
                this.attachEventListeners();
            }

            debounce(func, wait) {
                let timeout;
                return (...args) => {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func(...args), wait);
                };
            }

            showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                this.elements.toastContainer.appendChild(toast);
                void toast.offsetWidth;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3500);
            }

async callGemini(systemPrompt, userText) {
    const userApiKey = this.elements.apiKeyInput.value.trim();
    if (!userApiKey) throw new Error("Please enter your Gemini API key in Step 0.");

    if (this.abortController) this.abortController.abort();
    this.abortController = new AbortController();

    const timeoutId = setTimeout(() => {
        if (this.abortController) this.abortController.abort();
    }, 20000);

    // UPDATED: Using a model from your list (Gemini 2.5 Flash)
    const url = `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${userApiKey}`;
    
    // Keeping the merged prompt logic to ensure maximum compatibility
    const combinedPrompt = `[SYSTEM INSTRUCTIONS]\n${systemPrompt}\n\n[USER INPUT TO PROCESS]\n${userText}`;

    const payload = {
        contents: [{ 
            role: "user", 
            parts: [{ text: combinedPrompt }] 
        }],
        generationConfig: { 
            temperature: 1, // Gemini 2.5 standard temperature is 1
            maxOutputTokens: 4096 
        }
    };

    const retries = 2;
    for (let i = 0; i <= retries; i++) {
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal: this.abortController.signal
            });
            
            clearTimeout(timeoutId);
            const data = await response.json();

            if (!response.ok) {
                console.error("API Error Response:", data);
                throw new Error(data.error?.message || `API Error: ${response.status}`);
            }

            return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
        } catch (error) {
            if (error.name === 'AbortError') throw new Error('Request timed out.');
            if (i === retries) throw error;
            await new Promise(res => setTimeout(res, 1000));
        }
    }
}

            autoGrow(element) {
                element.style.height = 'auto';
                const minHeight = parseInt(element.getAttribute('data-min-height') || '120', 10);
                element.style.height = `${Math.max(element.scrollHeight, minHeight)}px`;
            }

            setupStorageAndAutoGrow() {
                const savedKey = localStorage.getItem('user_gemini_api_key');
                if (savedKey) this.elements.apiKeyInput.value = savedKey;

                this.elements.apiKeyInput.addEventListener('input', (e) => {
                    localStorage.setItem('user_gemini_api_key', e.target.value.trim());
                });

                this.elements.inputs.forEach(el => {
                    const saved = localStorage.getItem(el.id);
                    if (saved) { el.value = saved; this.autoGrow(el); }
                    el.addEventListener('input', this.debounce(() => {
                        try { localStorage.setItem(el.id, el.value); } catch(e) { this.showToast("Storage quota full!", "error"); }
                        this.autoGrow(el);
                    }, 500));
                });

                window.addEventListener('resize', this.debounce(() => {
                    this.elements.inputs.forEach(el => this.autoGrow(el));
                }, 150));
            }

            async handleAction(type) {
                const isUpgrade = type === 'upgrade';
                const inputIdx = isUpgrade ? 0 : 1;
                const outputIdx = isUpgrade ? 1 : 2;
                const text = this.elements.inputs[inputIdx].value.trim();

                if (!text && !isUpgrade) {
                    // If trying to compile but upgrade is empty, try original
                    const fallbackText = this.elements.inputs[0].value.trim();
                    if (!fallbackText) return this.showToast("Please enter text first.", "error");
                } else if (!text) {
                    return this.showToast("Please enter text first.", "error");
                }

                const system = isUpgrade ? 
                    "You are a prompt optimization engine. Make the user's prompt clear, specific, and professional. Return ONLY the improved prompt text." :
                    "You are an agent instruction compiler. Take the input prompt and return it in a structured format with sections for: Objective, Context, Constraints, and Step-by-Step Instructions.";

                const btn = isUpgrade ? this.elements.buttons.upgrade : this.elements.buttons.compile;
                btn.classList.add('is-loading');
                btn.disabled = true;

                try {
                    const result = await this.callGemini(system, text || this.elements.inputs[0].value.trim());
                    this.elements.inputs[outputIdx].value = result.trim();
                    localStorage.setItem(this.elements.inputs[outputIdx].id, result.trim());
                    this.autoGrow(this.elements.inputs[outputIdx]);
                    this.showToast(`${isUpgrade ? 'Prompt upgraded' : 'Instructions compiled'} successfully!`);
                } catch (err) {
                    if (err.name !== 'AbortError') this.showToast(err.message, 'error');
                } finally {
                    btn.classList.remove('is-loading');
                    btn.disabled = false;
                }
            }

            attachEventListeners() {
                this.elements.buttons.upgrade.addEventListener('click', () => this.handleAction('upgrade'));
                this.elements.buttons.compile.addEventListener('click', () => this.handleAction('compile'));
                this.elements.buttons.startOver.addEventListener('click', () => {
                    if (confirm("Reset everything?")) {
                        localStorage.clear();
                        location.reload();
                    }
                });
                [this.elements.buttons.copyUpgraded, this.elements.buttons.copyCompiled].forEach((btn, i) => {
                    btn.addEventListener('click', () => {
                        const el = this.elements.inputs[i + 1];
                        if (!el.value) return;
                        el.select();
                        document.execCommand('copy');
                        this.showToast("Copied to clipboard!");
                        window.getSelection().removeAllRanges();
                    });
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => new PromptApp());
    </script>
</body>
</html>
