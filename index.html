<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://generativelanguage.googleapis.com; style-src 'self' 'unsafe-inline';">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Prompt Optimizer & Compiler</title>
    
    <link rel="manifest" href="manifest.json">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --surface: #ffffff;
            --background: #f3f4f6;
            --text-main: #111827;
            --text-muted: #4b5563;
            --border: #d1d5db;
            --border-focus: #3b82f6;
            --disabled-bg: #9ca3af;
            --disabled-text: #f3f4f6;
            --final-surface: #f8fafc;
            --final-border: #cbd5e1;
            --error: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
        }

        .app-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .app-title { margin: 0; font-size: 1.5rem; font-weight: 700; }

        .section {
            background: var(--surface);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border);
            position: relative;
        }

        .byok-section { background-color: #e0f2fe; border-color: #bae6fd; }

        label { display: block; font-size: 1rem; margin-bottom: 8px; font-weight: 600; }
        .step-num { color: var(--primary); font-weight: 800; margin-right: 6px; }

        textarea, input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        .action-row { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }

        button {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-secondary { background-color: transparent; color: var(--text-muted); border: 1px solid var(--border); width: auto; }

        .copy-btn {
            position: absolute; top: 12px; right: 12px; width: 36px; height: 36px;
            background: white; border: 1px solid var(--border); border-radius: 6px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* Spinner & Toasts */
        .spinner { display: none; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; }
        .is-loading .spinner { display: inline-block; }
        .is-loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; width: 90%; max-width: 400px; }
        .toast { padding: 12px; border-radius: 8px; color: white; margin-bottom: 8px; text-align: center; opacity: 0; transition: 0.3s; }
        .toast.show { opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }

        @media (min-width: 640px) {
            .app-header, .action-row { flex-direction: row; align-items: center; justify-content: space-between; }
            #toast-container { bottom: auto; top: 20px; right: 20px; left: auto; transform: none; width: auto; }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <header class="app-header">
        <h1 class="app-title">Prompt Optimizer</h1>
        <button id="startOverBtn" class="btn-secondary">↻ Start Over</button>
    </header>

    <section class="section byok-section">
        <label for="apiKeyInput">Gemini API Key</label>
        <input type="password" id="apiKeyInput" placeholder="Paste your Gemini API key here...">
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">
            *Saved locally to your browser. Get a key at <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>.
        </p>
    </section>

    <main>
        <section class="section">
            <label for="userInput"><span class="step-num">1.</span> Original Prompt</label>
            <textarea id="userInput" data-min-height="120" placeholder="Enter raw prompt..."></textarea>
            <div class="action-row">
                <button id="upgradeBtn" class="btn-primary">
                    <span class="spinner"></span><span class="btn-text">Upgrade Prompt ↓</span>
                </button>
            </div>
        </section>

        <section class="section">
            <label for="upgradedArea"><span class="step-num">2.</span> Upgraded Prompt</label>
            <textarea id="upgradedArea" data-min-height="120" placeholder="Optimized result..."></textarea>
            <button class="copy-btn" id="copyUpgradedBtn">📋</button>
            <div class="action-row">
                <button id="compileBtn" class="btn-primary">
                    <span class="spinner"></span><span class="btn-text">Compile Prompt ↓</span>
                </button>
            </div>
        </section>

        <section class="section">
            <label for="outputArea"><span class="step-num">3.</span> Compiled Instructions</label>
            <textarea id="outputArea" data-min-height="200" placeholder="Final instructions..."></textarea>
            <button class="copy-btn" id="copyCompiledBtn">📋</button>
        </section>
    </main>

    <script>
        class PromptApp {
            constructor() {
                this.elements = {
                    apiKeyInput: document.getElementById('apiKeyInput'),
                    inputs: [document.getElementById('userInput'), document.getElementById('upgradedArea'), document.getElementById('outputArea')],
                    buttons: { upgrade: document.getElementById('upgradeBtn'), compile: document.getElementById('compileBtn'), startOver: document.getElementById('startOverBtn'), copyUpgraded: document.getElementById('copyUpgradedBtn'), copyCompiled: document.getElementById('copyCompiledBtn') },
                    toastContainer: document.getElementById('toast-container')
                };
                this.abortController = null;
                this.init();
            }

            init() {
                this.setupPersistence();
                this.attachListeners();
            }

            showToast(msg, type) {
                const t = document.createElement('div');
                t.className = `toast ${type} show`;
                t.textContent = msg;
                this.elements.toastContainer.appendChild(t);
                setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
            }

            debounce(fn, delay) {
                let timeout;
                return (...args) => { clearTimeout(timeout); timeout = setTimeout(() => fn(...args), delay); };
            }

            autoGrow(el) {
                el.style.height = 'auto';
                el.style.height = (el.scrollHeight) + 'px';
            }

            setupPersistence() {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) this.elements.apiKeyInput.value = savedKey;

                this.elements.apiKeyInput.addEventListener('input', (e) => localStorage.setItem('gemini_api_key', e.target.value.trim()));

                this.elements.inputs.forEach(el => {
                    const saved = localStorage.getItem(el.id);
                    if (saved) { el.value = saved; this.autoGrow(el); }
                    el.addEventListener('input', this.debounce(() => {
                        try { localStorage.setItem(el.id, el.value); } catch(e) { console.warn("Storage full"); }
                        this.autoGrow(el);
                    }, 500));
                });

                // Optimization: Debounce resize to prevent layout thrashing [cite: 290, 448]
                window.addEventListener('resize', this.debounce(() => this.elements.inputs.forEach(el => this.autoGrow(el)), 150));
            }

            async callGemini(systemPrompt, userText) {
                const key = this.elements.apiKeyInput.value.trim();
                if (!key) throw new Error("Please enter your API Key in Step 0.");

                if (this.abortController) this.abortController.abort();
                this.abortController = new AbortController();

                // Logic: 15s timeout for hanging requests [cite: 450]
                const timeoutId = setTimeout(() => this.abortController.abort(), 15000);

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;
                const payload = {
                    contents: [{ parts: [{ text: userText }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { temperature: 0.2, maxOutputTokens: 4096 }
                };

                const retries = 3;
                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload),
                            signal: this.abortController.signal
                        });
                        clearTimeout(timeoutId);
                        if (!response.ok) throw new Error(`API Error: ${response.status}`);
                        const data = await response.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response.";
                    } catch (err) {
                        if (i === retries - 1) throw err;
                        // Algorithmic backoff with jitter [cite: 688, 700]
                        await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000 + Math.random() * 500));
                    }
                }
            }

            async handleAction(type) {
                const isUpgrade = type === 'upgrade';
                const inputIdx = isUpgrade ? 0 : 1;
                const outputIdx = isUpgrade ? 1 : 2;
                const text = this.elements.inputs[inputIdx].value.trim() || (isUpgrade ? "" : this.elements.inputs[0].value.trim());

                if (!text) return this.showToast("Please provide input text.", "error");

                const sys = isUpgrade ? 
                    "Optimize this prompt. Make it clear, specific, and concise. Return ONLY the improved prompt." :
                    "Compile into structured agent instructions: Objective, Inputs, Constraints, Steps, Output.";

                const btn = isUpgrade ? this.elements.buttons.upgrade : this.elements.buttons.compile;
                btn.classList.add('is-loading');
                btn.disabled = true;

                try {
                    const result = await this.callGemini(sys, text);
                    this.elements.inputs[outputIdx].value = result;
                    localStorage.setItem(this.elements.inputs[outputIdx].id, result);
                    this.autoGrow(this.elements.inputs[outputIdx]);
                    this.showToast("Success!", "success");
                } catch (err) {
                    if (err.name !== 'AbortError') this.showToast(err.message, "error");
                } finally {
                    btn.classList.remove('is-loading');
                    btn.disabled = false;
                }
            }

            attachListeners() {
                this.elements.buttons.upgrade.addEventListener('click', () => this.handleAction('upgrade'));
                this.elements.buttons.compile.addEventListener('click', () => this.handleAction('compile'));
                this.elements.buttons.startOver.addEventListener('click', () => {
                    if (confirm("Clear all progress?")) {
                        localStorage.clear();
                        location.reload();
                    }
                });
                [this.elements.buttons.copyUpgraded, this.elements.buttons.copyCompiled].forEach((btn, i) => {
                    btn.addEventListener('click', () => {
                        const el = this.elements.inputs[i + 1];
                        el.select();
                        document.execCommand('copy');
                        this.showToast("Copied!", "success");
                    });
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => new PromptApp());
    </script>
</body>
</html>
